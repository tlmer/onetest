# -- NoC attach configuration ([*] customer-editable; no code change needed) ------------------
# Scope: the interface layer = standard AXI4 (independent of the NoC model); everything
# model-specific lives in this file
# without this file => all defaults (prototype scope), the benches still run [OK]

[addr]                        # address map: window name = position in the NoC address space, base size (hex)
dut_regs = 0x00000000 0x4000  # DUT register window (incl. doorbells)
mem      = 0x00100000 0x200000  # host memory window (SQ/CQ/PRP/data)

[task_addr]                   # base address of each task-model section (must fall inside the mem window, or change the window to match the customer map)
dev  = 0x00000000
asq  = 0x00100000
acq  = 0x00101000
iosq = 0x00102000
iocq = 0x00103000
prpl = 0x00104000
data = 0x00110000

[master]                      # master-port attributes (AxID/QOS/PROT/CACHE/USER; fill in per the customer's NoC mapping table)
task = id=1 qos=0 prot=0 cache=0xF user=0
dut  = id=2 qos=0 prot=0 cache=0x0 user=0

[axi]                         # bridge parameters (contract defaults: AxID width 4 | outstanding 4)
outstanding = 4
idw = 4
